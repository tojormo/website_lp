<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#bfe6f7">
<meta name="format-detection" content="telephone=no">
<title>とうじょうRMO 妖精とおはなし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   とうじょうRMO 妖精とおはなし（ゲームUI版 / bot2.html）
   - キャラを大きく表示し、ノベルゲーム風の会話ウィンドウで返答
   - 選択肢ボタン / なかよし度ゲージ / 会話ログ
   ========================================================= */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --green: #2f7a43;
  --green-deep: #1f5530;
  --leaf: #5fb877;
  --mint: #e3f3e7;
  --ink: #2a2f2c;
  --ink-soft: #5f6a63;
  --sun: #ffd24d;
  --pink: #ff7a9c;
  --danger: #d9383a;
  --grad: linear-gradient(135deg, #4cb36a 0%, #2f7a43 100%);
  --round: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
  --game: "Dela Gothic One", "Zen Maru Gothic", sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1);
  --pop: cubic-bezier(.34,1.56,.64,1);
}
html, body {
  height: 100%; overflow: hidden; overscroll-behavior: none;
  background: #bfe6f7; color: var(--ink);
  font-family: "Noto Sans JP", sans-serif; line-height: 1.75;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  touch-action: manipulation;
}
button, textarea { font-family: inherit; -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 全体（iPhoneのキーボードに追従） ---------- */
.game {
  position: fixed; left: 0; right: 0; top: 0;
  height: 100vh; height: 100dvh; height: var(--app-h, 100dvh);
  max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; overflow: hidden;
}

/* ---------- 背景：空・雲・山・田んぼ ---------- */
.scene { position: absolute; inset: 0; overflow: hidden; z-index: 0;
  background: linear-gradient(180deg, #8fd3f2 0%, #bfe6f7 38%, #e9f7fb 62%, #f6fbf2 100%); }
.sun { position: absolute; top: 12%; right: 12%; width: 74px; height: 74px; border-radius: 50%;
  background: radial-gradient(circle, #fff6c9 0 40%, var(--sun) 41% 100%);
  box-shadow: 0 0 0 14px rgba(255,210,77,.18), 0 0 0 30px rgba(255,210,77,.08); }
.cloud { position: absolute; height: 26px; border-radius: 30px; background: #fff; opacity: .9; animation: cloud 38s linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 34px; height: 34px; left: 14px; top: -16px; }
.cloud::after { width: 24px; height: 24px; left: 40px; top: -10px; }
.cloud.c1 { width: 90px; top: 17%; left: -100px; }
.cloud.c2 { width: 70px; top: 28%; left: -100px; animation-duration: 52s; animation-delay: -26s; transform: scale(.8); opacity: .75; }
.cloud.c3 { width: 110px; top: 9%; left: -120px; animation-duration: 64s; animation-delay: -44s; opacity: .8; }
@keyframes cloud { to { left: 110%; } }
.hill { position: absolute; border-radius: 50%; }
.hill.h1 { width: 140%; height: 46%; left: -50%; bottom: 14%; background: #9fd6a8; }
.hill.h2 { width: 130%; height: 42%; right: -55%; bottom: 10%; background: #7cc68a; }
.field { position: absolute; left: -10%; right: -10%; bottom: 0; height: 26%;
  background: repeating-linear-gradient(100deg, #8ccf6f 0 18px, #9ad87c 18px 36px);
  border-radius: 50% 50% 0 0 / 30px 30px 0 0; }

/* ---------- HUD（上部） ---------- */
.hud { position: relative; z-index: 20; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) 12px 0; }
.status {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  background: rgba(255,255,255,.9); border-radius: 999px; padding: 4px 14px 4px 4px;
  box-shadow: 0 4px 0 rgba(31,85,48,.18), 0 8px 18px -8px rgba(31,85,48,.4);
  border: 2px solid #fff;
}
.status-face { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
  background: var(--mint); box-shadow: 0 0 0 2px var(--leaf); }
.status-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.status-body { min-width: 0; }
.status-name { font-family: var(--round); font-weight: 900; font-size: .8rem; color: var(--green-deep); line-height: 1.2; white-space: nowrap; }
.status-name .lv { font-family: var(--game); font-weight: 400; font-size: .72rem; color: #fff; background: var(--grad);
  border-radius: 6px; padding: 0 5px; margin-left: 4px; letter-spacing: .04em; }
.gauge-row { display: flex; align-items: center; gap: 5px; margin-top: 3px; }
.gauge-row .heart { width: 12px; height: 12px; color: var(--pink); flex-shrink: 0; }
.gauge { position: relative; width: 92px; height: 8px; border-radius: 8px; background: #f1e6ea; overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.12); }
.gauge i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 8px;
  background: linear-gradient(90deg, #ffa7bd, var(--pink)); transition: width .8s var(--pop); }
.gauge-label { font-family: var(--round); font-weight: 700; font-size: .6rem; color: var(--ink-soft); white-space: nowrap; }
.hud-btns { display: flex; gap: 8px; flex-shrink: 0; }
.icon-btn {
  width: 44px; height: 48px; border: 2px solid #fff; border-radius: 14px;
  background: rgba(255,255,255,.9); color: var(--green-deep);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  box-shadow: 0 4px 0 rgba(31,85,48,.18), 0 8px 18px -8px rgba(31,85,48,.4);
  font-family: var(--round); font-weight: 900; font-size: .56rem; line-height: 1.2;
  transition: transform .15s var(--ease), box-shadow .15s;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(31,85,48,.18); }

/* ---------- ステージ（キャラクター） ---------- */
.stage { position: relative; z-index: 5; flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; }
.chara { position: relative; height: 100%; max-height: 420px; display: flex; align-items: flex-end; justify-content: center;
  padding-top: 10px; margin-bottom: -34px; -webkit-tap-highlight-color: transparent; cursor: pointer; }
.chara img { height: 100%; width: auto; max-width: 86vw; object-fit: contain; object-position: bottom; display: block;
  transform-origin: 50% 100%; filter: drop-shadow(0 10px 12px rgba(31,85,48,.25));
  animation: breathe 3.2s ease-in-out infinite; }
.chara img.fallback { border-radius: 50%; height: 60%; }
.chara::after { content: ""; position: absolute; bottom: 30px; left: 50%; width: 46%; height: 14px; transform: translateX(-50%);
  border-radius: 50%; background: rgba(31,85,48,.22); filter: blur(3px); z-index: -1; }
@keyframes breathe { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-6px) scale(1.01,.99); } }
.game.is-talking .chara img { animation: talk .28s ease-in-out infinite alternate; }
@keyframes talk { from { transform: translateY(0) scale(1,1); } to { transform: translateY(-4px) scale(1.015,.985); } }
.game.is-thinking .chara img { animation: think 1.3s ease-in-out infinite; }
@keyframes think { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-4px); } }
.game.is-happy .chara img { animation: hop .55s var(--ease) 2; }
@keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-26px) scale(.98,1.03); } }
.game.is-error .chara img { animation: shake .45s ease-in-out 2; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px) rotate(-3deg); } 75% { transform: translateX(7px) rotate(3deg); } }
/* 考え中の「…」吹き出し */
.think-bubble { position: absolute; top: 14%; right: 6%; z-index: 6; background: #fff; border-radius: 18px; padding: 6px 12px;
  box-shadow: 0 6px 14px -6px rgba(31,85,48,.35); display: none; }
.think-bubble::after { content: ""; position: absolute; left: 6px; bottom: -8px; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
.game.is-thinking .think-bubble { display: flex; animation: popIn .3s var(--pop); }
.dots { display: inline-flex; gap: 4px; align-items: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--leaf); animation: blink 1.4s infinite ease-in-out both; }
.dots i:nth-child(1) { animation-delay: -.32s; }
.dots i:nth-child(2) { animation-delay: -.16s; }
@keyframes blink { 0%,80%,100% { transform: scale(.3); opacity: .3; } 40% { transform: scale(1); opacity: 1; } }
@keyframes popIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
/* なかよし度UP 演出 */
.toast { position: absolute; left: 50%; top: 30%; z-index: 30; transform: translateX(-50%); pointer-events: none;
  font-family: var(--game); font-size: 1.15rem; color: #fff; letter-spacing: .04em; white-space: nowrap;
  -webkit-text-stroke: 5px var(--pink); paint-order: stroke fill; text-shadow: 0 4px 0 rgba(180,40,80,.35);
  animation: toastUp 1.6s var(--ease) forwards; }
.toast.lvup { -webkit-text-stroke-color: #f0a300; text-shadow: 0 4px 0 rgba(160,100,0,.35); font-size: 1.4rem; }
@keyframes toastUp { 0% { opacity: 0; transform: translate(-50%, 16px) scale(.6); } 18% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
  30% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }

/* ---------- 会話ウィンドウ（ノベルゲーム風） ---------- */
.dialog-area { position: relative; z-index: 10; padding: 0 10px; }
.player-line { display: flex; justify-content: flex-end; margin: 0 4px 8px; }
.player-line span { max-width: 86%; background: var(--grad); color: #fff; font-family: var(--round); font-weight: 700; font-size: .82rem;
  line-height: 1.5; padding: 6px 14px; border-radius: 16px 16px 4px 16px; box-shadow: 0 4px 0 rgba(31,85,48,.25);
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all;
  animation: popIn .25s var(--pop); }
.player-line[hidden] { display: none; }
.dialog {
  position: relative; background: rgba(255,255,255,.96);
  border-radius: 22px; border: 3px solid #fff;
  box-shadow: 0 0 0 3px var(--leaf), 0 8px 0 3px rgba(31,85,48,.22), 0 18px 30px -10px rgba(31,85,48,.45);
  padding: 22px 16px 14px; margin-top: 12px;
}
.dialog.error { box-shadow: 0 0 0 3px #f19a9b, 0 8px 0 3px rgba(150,30,30,.18), 0 18px 30px -10px rgba(150,30,30,.3); }
.nametag { position: absolute; top: -16px; left: 14px; display: inline-flex; align-items: center; gap: 6px;
  background: var(--grad); color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 2px 14px 2px 10px;
  font-family: var(--round); font-weight: 900; font-size: .8rem; letter-spacing: .06em;
  box-shadow: 0 3px 0 rgba(31,85,48,.3); }
.nametag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sun); }
.dialog.error .nametag { background: linear-gradient(135deg, #ef6a6b, var(--danger)); }
.dialog-scroll { max-height: calc(var(--app-h, 100dvh) * .34); min-height: 52px; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; font-size: .95rem; line-height: 1.8; padding-right: 2px; }
.dialog-scroll .greet { font-family: var(--round); font-weight: 900; font-size: 1.08rem; color: var(--green-deep); line-height: 1.6; }
.dialog-scroll .sub { font-family: var(--round); font-weight: 500; font-size: .8rem; color: var(--ink-soft); margin-top: 2px; }
.dialog-scroll .err { color: var(--danger); font-weight: 500; }
.next { position: absolute; right: 16px; bottom: 6px; width: 0; height: 0; border-style: solid; border-width: 9px 7px 0;
  border-color: var(--leaf) transparent transparent; opacity: 0; }
.dialog.done .next { opacity: 1; animation: nextBob .8s ease-in-out infinite; }
@keyframes nextBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
.cursor { display: inline-block; width: 2px; height: 1em; background: var(--leaf); vertical-align: -.15em; margin-left: 1px; animation: caret .7s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* 回答のMarkdown */
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md .h { font-family: var(--round); font-weight: 900; color: var(--green-deep); margin: 10px 0 4px; }
.md .h::before { content: "◆"; color: var(--leaf); margin-right: 4px; font-size: .8em; }
.md strong { color: var(--green-deep); font-weight: 700; background: linear-gradient(transparent 62%, rgba(255,210,77,.55) 62%); }
.md ul, .md ol { margin: 4px 0 10px; padding-left: 1.3em; }
.md li { margin: 2px 0; }
.md li.pending { visibility: hidden; }
.md li::marker { color: var(--leaf); }
.md code { background: var(--mint); color: var(--green-deep); border-radius: 4px; padding: 1px 5px; font-size: .88em; }
.md blockquote { margin: 6px 0 10px; padding: 6px 12px; border-left: 3px solid var(--leaf); background: #f4faf5; border-radius: 0 10px 10px 0; color: var(--ink-soft); font-size: .88rem; }
.table-wrap { overflow-x: auto; margin: 6px 0 10px; border-radius: 10px; box-shadow: 0 0 0 1px var(--mint); }
.md table { border-collapse: collapse; font-size: .8rem; width: 100%; min-width: 280px; }
.md th, .md td { border-bottom: 1px solid var(--mint); padding: 6px 10px; text-align: left; }
.md th { background: var(--mint); color: var(--green-deep); white-space: nowrap; font-family: var(--round); font-weight: 900; }
.notice { font-size: .78rem; color: #7a5d12; background: #fff8e1; border-radius: 10px; padding: 5px 10px; margin-top: 8px; }

/* ---------- 選択肢（ゲームのメニュー風） ---------- */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.choices[hidden] { display: none; }
.choice {
  position: relative; text-align: left; border: 2px solid var(--leaf); background: #fff; color: var(--green-deep);
  border-radius: 14px; padding: 8px 10px 8px 26px; min-height: 44px;
  font-family: var(--round); font-weight: 900; font-size: .8rem; line-height: 1.35;
  box-shadow: 0 4px 0 var(--leaf); transition: transform .12s var(--ease), box-shadow .12s, background .12s;
  animation: choiceIn .35s var(--pop) both;
}
.choice::before { content: ""; position: absolute; left: 10px; top: 50%; margin-top: -5px; border-style: solid; border-width: 5px 0 5px 8px;
  border-color: transparent transparent transparent var(--leaf); }
.choice:nth-child(2) { animation-delay: .05s; } .choice:nth-child(3) { animation-delay: .1s; } .choice:nth-child(4) { animation-delay: .15s; }
.choice:active { transform: translateY(4px); box-shadow: 0 0 0 var(--leaf); background: var(--mint); }
@media (hover: hover) { .choice:hover { background: var(--mint); } }
.choice:disabled { opacity: .5; }
/* 回答後の選択肢：1行のコンパクト表示 */
.choices.compact { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px -16px 0; padding: 0 16px 6px; }
.choices.compact::-webkit-scrollbar { display: none; }
.choices.compact .choice { flex-shrink: 0; white-space: nowrap; min-height: 36px; padding: 5px 12px 5px 22px; font-size: .76rem; border-radius: 999px; box-shadow: 0 3px 0 var(--leaf); }
.choices.compact .choice::before { left: 9px; border-width: 4px 0 4px 7px; margin-top: -4px; }
.choices.compact[hidden] { display: none; }
@keyframes choiceIn { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
.retry { margin-top: 10px; border: 2px solid var(--danger); background: #fff; color: var(--danger); border-radius: 999px;
  padding: 6px 16px; min-height: 40px; font-family: var(--round); font-weight: 900; font-size: .82rem; box-shadow: 0 3px 0 #f19a9b; }
.retry:active { transform: translateY(3px); box-shadow: none; }

/* ---------- 入力バー ---------- */
.input-bar { position: relative; z-index: 10; padding: 12px 10px calc(10px + env(safe-area-inset-bottom)); }
.composer { display: flex; gap: 8px; align-items: flex-end; background: #fff; border-radius: 999px; padding: 4px 4px 4px 16px;
  border: 3px solid #fff; box-shadow: 0 0 0 2px var(--leaf), 0 6px 0 2px rgba(31,85,48,.2); transition: box-shadow .2s; }
.composer:focus-within { box-shadow: 0 0 0 3px var(--green), 0 6px 0 2px rgba(31,85,48,.2); }
.composer textarea { flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--ink);
  font-size: 16px; line-height: 1.5; padding: 8px 0; min-height: 40px; max-height: 96px;
  -webkit-appearance: none; appearance: none; border-radius: 0; }
.composer textarea::placeholder { color: #9aa49d; }
.send-btn { width: 42px; height: 42px; flex-shrink: 0; border: none; border-radius: 50%; background: var(--grad); color: #fff;
  display: grid; place-items: center; box-shadow: 0 3px 0 var(--green-deep); transition: transform .12s, box-shadow .12s; }
.send-btn svg { width: 18px; height: 18px; transform: translateX(1px); }
.send-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.send-btn:disabled { background: #dfe4df; color: #a6aea7; box-shadow: 0 3px 0 #c8cec8; cursor: default; }
.input-foot { display: flex; justify-content: center; gap: 8px; margin-top: 8px; font-size: .64rem; color: var(--green-deep);
  font-family: var(--round); font-weight: 700; text-shadow: 0 1px 0 rgba(255,255,255,.8); }
.counter.over { color: var(--danger); }

/* ---------- 会話ログ ---------- */
.log { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; background: rgba(20,45,28,.55);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fadeIn .2s; }
.log[hidden] { display: none; }
@keyframes fadeIn { from { opacity: 0; } }
.log-sheet { margin-top: auto; height: 86%; background: #f6fbf7; border-radius: 24px 24px 0 0; display: flex; flex-direction: column;
  box-shadow: 0 -10px 30px rgba(0,0,0,.2); animation: sheetUp .3s var(--ease); }
@keyframes sheetUp { from { transform: translateY(40%); opacity: .4; } }
.log-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 2px dashed var(--mint); }
.log-head h2 { font-family: var(--game); font-weight: 400; font-size: 1rem; color: var(--green-deep); letter-spacing: .08em; }
.log-close { min-width: 44px; min-height: 36px; border: none; border-radius: 999px; background: var(--mint); color: var(--green-deep);
  font-family: var(--round); font-weight: 900; font-size: .8rem; padding: 0 14px; }
.log-body { flex: 1; overflow-y: auto; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
.log-empty { text-align: center; color: var(--ink-soft); font-family: var(--round); font-weight: 700; font-size: .85rem; margin-top: 40px; }
.log-msg { display: flex; gap: 8px; margin: 12px 0; align-items: flex-start; }
.log-msg.user { justify-content: flex-end; }
.log-av { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--mint); box-shadow: 0 0 0 2px var(--leaf); }
.log-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.log-bubble { border-radius: 18px; padding: 10px 14px; font-size: .88rem; line-height: 1.75; overflow-wrap: anywhere; }
.log-msg.bot .log-bubble { background: #fff; border-top-left-radius: 4px; box-shadow: 0 4px 14px -8px rgba(31,85,48,.35); flex: 1; min-width: 0; }
.log-msg.user .log-bubble { background: var(--grad); color: #fff; border-top-right-radius: 4px; max-width: 84%; white-space: pre-wrap; font-weight: 500; }

/* ---------- キーボード表示中 ---------- */
.kb-open .stage { flex: 0 0 0; }
.kb-open .chara, .kb-open .sun, .kb-open .choices, .kb-open .input-foot, .kb-open .player-line { display: none; }
.kb-open .dialog-scroll { max-height: calc(var(--app-h, 100dvh) - 210px); }
.kb-open .input-bar { padding-bottom: 8px; }

/* ---------- 小さい画面（iPhone SE など） ---------- */
@media (max-height: 600px) {
  .hud { padding-top: calc(8px + env(safe-area-inset-top)); }
  .dialog { padding: 20px 14px 12px; }
  .dialog-scroll { font-size: .9rem; line-height: 1.75; max-height: calc(var(--app-h, 100dvh) * .27); }
  .dialog-scroll .greet { font-size: 1rem; }
  .choices { gap: 6px; margin-top: 10px; }
  .choice { min-height: 40px; padding: 6px 8px 6px 24px; font-size: .76rem; }
  .input-bar { padding-top: 10px; }
  .input-foot { margin-top: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="game" id="game">
  <!-- 背景 -->
  <div class="scene" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="hill h1"></div><div class="hill h2"></div>
    <div class="field"></div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="status">
      <div class="status-face" id="statusFace"></div>
      <div class="status-body">
        <div class="status-name">RMOの妖精<span class="lv" id="lv">Lv.1</span></div>
        <div class="gauge-row">
          <svg class="heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.4 2.4h1.8c.8-1.3 2.3-2.4 4.4-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
          <div class="gauge" role="progressbar" aria-label="なかよし度" aria-valuemin="0" aria-valuemax="100" id="gauge"><i id="gaugeFill"></i></div>
          <span class="gauge-label">なかよし度</span>
        </div>

      </button>
      <button type="button" class="icon-btn" id="resetBtn" aria-label="最初から">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>最初から
      </button>
    </div>
  </div>

  <!-- キャラクター -->
  <div class="stage">
    <div class="think-bubble" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span></div>
    <div class="chara" id="chara" title="タップしてね"></div>
  </div>

  <!-- 会話ウィンドウ -->
  <div class="dialog-area">
    <div class="player-line" id="playerLine" hidden><span id="playerText"></span></div>
    <div class="dialog" id="dialog" aria-live="polite">
      <span class="nametag" id="nametag">RMOの妖精</span>
      <div class="dialog-scroll" id="dialogScroll"></div>
      <div class="choices" id="choices"></div>
      <span class="next" aria-hidden="true"></span>
    </div>
  </div>

  <!-- 入力 -->
  <div class="input-bar">
    <form class="composer" id="form" autocomplete="off">
      <label for="input" class="sr-only">質問を入力</label>
      <textarea id="input" rows="1" maxlength="1200" enterkeyhint="send" placeholder="妖精に話しかけてね"></textarea>
      <button type="submit" class="send-btn" id="send" aria-label="送信">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
    <div class="input-foot">
      <span>※AIの妖精がお答えします。くわしくは事務局にご確認ください。</span>
      <span class="counter" id="counter"></span>
    </div>
  </div>

  <!-- 会話ログ -->
  <div class="log" id="log" hidden>
    <div class="log-sheet" role="dialog" aria-modal="true" aria-labelledby="logTitle">
      <div class="log-head">
        <h2 id="logTitle">会話ログ</h2>
        <button type="button" class="log-close" id="logClose">とじる</button>
      </div>
      <div class="log-body" id="logBody"></div>
    </div>
  </div>
</div>

<script>
  // ===== 設定（bot.html と同じ） =====
  var GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwyNSdhkTZ5b8HCTXBGhIHOaYQrvg8vyohEws7m7rbP_wbyLkz_--m5tJbaSujH2G5dzw/exec';
  var IMG_BASE = 'images/';
  var CHARA_ALT = 'とうじょうRMOの妖精';
  var MAX_CHARS = 1000;
  var MAX_HISTORY_TURNS = 6;
  var GREETING = 'やっほー！ とうじょうRMOのこと、なんでも聞いてね！';
  var GREETING_SUB = '下の選択肢をえらぶか、自由に話しかけてね。';
  var EXAMPLES = [
    'とうじょうRMOってなに？',
    'どんな課題があるの？',
    'スマート農業って何？',
    'わたしも参加できる？'
  ];
  var POKE_LINES = [
    'わっ！くすぐったいよ〜',
    '東条のお米、おいしいんだよ！',
    '気になることがあったら、下から話しかけてね！',
    '山田錦って知ってる？酒米なんだ！'
  ];
  var XP_PER_LEVEL = 3;   // 何回質問するとレベルアップするか

  var state = { history: [], log: [], busy: false, asked: {}, xp: 0, typing: null };
  var els = {};
  var HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;

  // ===== キャラクター画像 =====
  var FALLBACK_FACE = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
    '<circle cx="32" cy="32" r="32" fill="#eef5f0"/>' +
    '<path d="M32 10 Q46 10 46 32 Q46 52 32 52 Q18 52 18 32 Q18 10 32 10" fill="#9ed4ab"/>' +
    '<circle cx="26" cy="28" r="3.2" fill="#245e34"/><circle cx="38" cy="28" r="3.2" fill="#245e34"/>' +
    '<path d="M28 37 Q32 41 36 37" stroke="#245e34" stroke-width="2.6" fill="none" stroke-linecap="round"/>' +
    '</svg>');
  function charaImg(kind, alt) {
    var img = document.createElement('img');
    img.alt = alt || '';
    img.addEventListener('error', function onErr() {
      img.removeEventListener('error', onErr);
      img.src = FALLBACK_FACE;
      if (kind === 'full') img.classList.add('fallback');
    });
    img.src = IMG_BASE + (kind === 'full' ? 'chara-full_nograin.png' : 'chara-face.png');
    return img;
  }

  // ===== HTML エスケープ + Markdown（bot.html と同じ） =====
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function inlineMd(escaped) {
    return escaped
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  function isTableSep(line) {
    return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(line);
  }
  function tableCells(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return inlineMd(esc(c.trim())); });
  }
  var RE_UL = /^\s*(?:[-*]\s+|・\s*)(.*)$/;
  var RE_OL = /^\s*(\d+)[.)．]\s+(.*)$/;
  var RE_H = /^\s*#{1,6}\s+(.*)$/;
  var RE_QUOTE = /^\s*>\s?(.*)$/;
  function startsBlock(lines, i) {
    var l = lines[i];
    return RE_UL.test(l) || RE_OL.test(l) || RE_H.test(l) || RE_QUOTE.test(l) ||
      (l.indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1]));
  }
  function renderMarkdown(md) {
    var lines = String(md == null ? '' : md).replace(/\r\n?/g, '\n').split('\n');
    var html = '', i = 0, m, items;
    while (i < lines.length) {
      var l = lines[i];
      if (!l.trim()) { i++; continue; }
      if (l.indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var head = tableCells(l); i += 2;
        var rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') >= 0) { rows.push(tableCells(lines[i])); i++; }
        html += '<div class="table-wrap"><table><thead><tr>' +
          head.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
          rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</tbody></table></div>';
        continue;
      }
      if ((m = l.match(RE_H))) { html += '<p class="h">' + inlineMd(esc(m[1])) + '</p>'; i++; continue; }
      if (RE_UL.test(l)) {
        items = [];
        while (i < lines.length && (m = lines[i].match(RE_UL))) { items.push('<li>' + inlineMd(esc(m[1])) + '</li>'); i++; }
        html += '<ul>' + items.join('') + '</ul>'; continue;
      }
      if ((m = l.match(RE_OL))) {
        var start = parseInt(m[1], 10) || 1;
        items = [];
        while (i < lines.length && (m = lines[i].match(RE_OL))) { items.push('<li>' + inlineMd(esc(m[2])) + '</li>'); i++; }
        html += '<ol' + (start !== 1 ? ' start="' + start + '"' : '') + '>' + items.join('') + '</ol>'; continue;
      }
      if (RE_QUOTE.test(l)) {
        items = [];
        while (i < lines.length && (m = lines[i].match(RE_QUOTE))) { items.push(inlineMd(esc(m[1]))); i++; }
        html += '<blockquote>' + items.join('<br>') + '</blockquote>'; continue;
      }
      var buf = [inlineMd(esc(l.trim()))]; i++;
      while (i < lines.length && lines[i].trim() && !startsBlock(lines, i)) { buf.push(inlineMd(esc(lines[i].trim()))); i++; }
      html += '<p>' + buf.join('<br>') + '</p>';
    }
    return html;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ===== キャラの気分 =====
  var moodTimer = null;
  function setMood(mood, ms) {
    clearTimeout(moodTimer);
    els.game.classList.remove('is-happy', 'is-error', 'is-thinking', 'is-talking');
    if (mood && mood !== 'idle') els.game.classList.add('is-' + mood);
    if (ms) moodTimer = setTimeout(function () { setMood('idle'); }, ms);
  }

  // ===== 文字送り（タイプライター） =====
  function stopTyping(finish) {
    var t = state.typing;
    if (!t) return;
    clearInterval(t.timer);
    if (finish) t.nodes.forEach(function (n, i) { n.nodeValue = t.texts[i]; });
    (t.pend || []).forEach(function (p) { p.li.classList.remove('pending'); });
    if (t.cursor && t.cursor.parentNode) t.cursor.remove();
    state.typing = null;
    els.game.classList.remove('is-talking');
    els.dialog.classList.add('done');
    if (t.onDone) t.onDone();
  }
  function typeInto(container, html, onDone) {
    stopTyping(true);
    els.dialog.classList.remove('done');
    container.innerHTML = html;
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [], texts = [], total = 0, n;
    while ((n = walker.nextNode())) { nodes.push(n); texts.push(n.nodeValue); total += n.nodeValue.length; n.nodeValue = ''; }
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var pend = Array.prototype.map.call(container.querySelectorAll('li'), function (li) { li.classList.add('pending'); return { li: li }; });
    var t = { nodes: nodes, texts: texts, onDone: onDone, cursor: el('span', 'cursor'), pend: pend };
    state.typing = t;
    if (reduce || !total) { stopTyping(true); return; }
    var step = Math.max(1, Math.ceil(total / 140));   // 長い回答でも約4秒以内に表示しきる
    var ni = 0, ci = 0;
    els.game.classList.add('is-talking');
    t.timer = setInterval(function () {
      var k = step;
      while (k > 0 && ni < nodes.length) {
        var full = texts[ni], take = Math.min(k, full.length - ci);
        ci += take; k -= take;
        nodes[ni].nodeValue = full.slice(0, ci);
        if (ci >= full.length) { ni++; ci = 0; }
      }
      for (var j = 0; j < pend.length; j++) { if (pend[j].li.textContent.length) { pend[j].li.classList.remove('pending'); pend.splice(j--, 1); } }
      var cur = nodes[Math.min(ni, nodes.length - 1)];
      if (cur && cur.parentNode) cur.parentNode.insertBefore(t.cursor, cur.nextSibling);
      if (ni >= nodes.length) { stopTyping(false); return; }
      var sc = els.dialogScroll;
      if (sc.scrollHeight - sc.scrollTop - sc.clientHeight < 60) sc.scrollTop = sc.scrollHeight;
    }, 28);
  }

  // ===== 会話ウィンドウ =====
  function setDialogError(isErr) {
    els.dialog.classList.toggle('error', !!isErr);
    els.nametag.textContent = isErr ? 'おっと…' : 'RMOの妖精';
  }
  function showPlayerLine(text) {
    if (!text) { els.playerLine.hidden = true; return; }
    els.playerText.textContent = text;
    els.playerLine.hidden = false;
    var s = els.playerText; s.style.animation = 'none'; void s.offsetWidth; s.style.animation = '';
  }
  function renderChoices(list, compact) {
    els.choices.innerHTML = '';
    els.choices.classList.toggle('compact', !!compact);
    if (!list || !list.length) { els.choices.hidden = true; return; }
    list.forEach(function (q) {
      var c = el('button', 'choice', q);
      c.type = 'button';
      c.disabled = state.busy;
      c.addEventListener('click', function () { send(q); });
      els.choices.appendChild(c);
    });
    els.choices.hidden = false;
  }
  function unaskedExamples(max) {
    return EXAMPLES.filter(function (q) { return !state.asked[q]; }).slice(0, max);
  }
  function showWelcome() {
    setDialogError(false);
    showPlayerLine('');
    renderChoices([]);
    els.dialogScroll.scrollTop = 0;
    typeInto(els.dialogScroll,
      '<p class="greet">' + esc(GREETING) + '</p><p class="sub">' + esc(GREETING_SUB) + '</p>',
      function () { renderChoices(EXAMPLES); });
    setMood('happy', 1200);
  }
  function showThinking() {
    setDialogError(false);
    renderChoices([]);
    stopTyping(true);
    els.dialog.classList.remove('done');
    els.dialogScroll.innerHTML = '';
    var p = el('p', 'sub');
    var label = el('span', null, '資料をよんでいます…');
    p.appendChild(label);
    els.dialogScroll.appendChild(p);
    setMood('thinking');
    var sec = 0;
    var timer = setInterval(function () {
      sec++;
      if (sec === 3) label.textContent = 'お返事を考えているよ…';
      if (sec >= 12) label.textContent = 'もう少し待ってね…';
    }, 1000);
    return { stop: function () { clearInterval(timer); } };
  }
  function showAnswer(res) {
    setDialogError(false);
    setMood('idle');
    els.dialogScroll.scrollTop = 0;
    var html = '<div class="md">' + renderMarkdown(res.answer) + '</div>';
    if (res.truncated) html += '<div class="notice">※ 文章が長いため途中で終了しました。質問を分けて試してみてね。</div>';
    typeInto(els.dialogScroll, html, function () { renderChoices(unaskedExamples(4), true); });
  }
  function showError(message, retryQuestion) {
    setDialogError(true);
    renderChoices([]);
    stopTyping(true);
    els.dialogScroll.innerHTML = '';
    els.dialogScroll.appendChild(el('p', 'err', message));
    if (retryQuestion) {
      var btn = el('button', 'retry', 'もういちど送信');
      btn.type = 'button';
      btn.addEventListener('click', function () { if (!state.busy) send(retryQuestion, { retry: true }); });
      els.dialogScroll.appendChild(btn);
    }
    els.dialog.classList.add('done');
    setMood('error', 1000);
  }
  function pokeChara() {
    if (state.busy || state.typing) return;
    setDialogError(false);
    showPlayerLine('');
    renderChoices([]);
    var line = POKE_LINES[Math.floor(Math.random() * POKE_LINES.length)];
    typeInto(els.dialogScroll, '<p class="greet">' + esc(line) + '</p>', function () {
      if (state.log.length) renderChoices(unaskedExamples(4), true); else renderChoices(EXAMPLES);
    });
    setMood('happy', 1100);
  }

  // ===== なかよし度 =====
  function loadXp() { try { state.xp = parseInt(localStorage.getItem('rmo_bond_xp'), 10) || 0; } catch (e) { } }
  function saveXp() { try { localStorage.setItem('rmo_bond_xp', String(state.xp)); } catch (e) { } }
  function renderBond() {
    var lv = Math.floor(state.xp / XP_PER_LEVEL) + 1;
    var pct = Math.round((state.xp % XP_PER_LEVEL) / XP_PER_LEVEL * 100);
    els.lv.textContent = 'Lv.' + lv;
    els.gaugeFill.style.width = Math.max(pct, 4) + '%';
    els.gauge.setAttribute('aria-valuenow', pct);
  }
  function toast(text, cls) {
    var t = el('div', 'toast' + (cls ? ' ' + cls : ''), text);
    els.game.appendChild(t);
    setTimeout(function () { t.remove(); }, 1700);
  }
  function gainBond() {
    var before = Math.floor(state.xp / XP_PER_LEVEL);
    state.xp++; saveXp(); renderBond();
    if (Math.floor(state.xp / XP_PER_LEVEL) > before) { toast('なかよし Lv.UP!', 'lvup'); setMood('happy', 1200); }
    else toast('なかよし度 UP!');
  }

  // ===== 会話ログ =====
  function addLog(role, text) { state.log.push({ role: role, text: text }); }
  function openLog() {
    var body = els.logBody;
    body.innerHTML = '';
    if (!state.log.length) body.appendChild(el('p', 'log-empty', 'まだ会話はないよ。話しかけてみてね！'));
    state.log.forEach(function (m) {
      var row = el('div', 'log-msg ' + m.role);
      if (m.role === 'bot') {
        var av = el('div', 'log-av'); av.appendChild(charaImg('face', ''));
        var b = el('div', 'log-bubble md'); b.innerHTML = renderMarkdown(m.text);
        row.appendChild(av); row.appendChild(b);
      } else {
        row.appendChild(el('div', 'log-bubble', m.text));
      }
      body.appendChild(row);
    });
    els.log.hidden = false;
    body.scrollTop = body.scrollHeight;
    els.logClose.focus();
  }
  function closeLog() { els.log.hidden = true; els.logBtn.focus(); }

  // ===== サーバー呼び出し（bot.html と同じ） =====
  function clientId() {
    try {
      var id = localStorage.getItem('chat_cid');
      if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('chat_cid', id); }
      return id;
    } catch (e) { return ''; }
  }
  function callAsk(payload) {
    if (HAS_GAS) {
      return new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).ask(payload);
      });
    }
    if (GAS_ENDPOINT) {
      payload.clientId = clientId();
      return fetch(GAS_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    }
    return new Promise(function (resolve) { setTimeout(function () { resolve(previewAnswer()); }, 1200); });
  }
  function previewAnswer() {
    return {
      ok: true, elapsedMs: 1200,
      answer: '（プレビュー表示だよ！GASと連携すると本番の回答が返ってくるよ）\n\n**とうじょうRMO**は、東条地域の「岡本・森・南山」のみんなが手を取り合って、農業と豊かな暮らしを未来につなぐためのチームだよ！\n\n- お米（酒米・山田錦）の畑や水路を守る\n- スマート農業で、作業を少しでも楽にする\n- おじいちゃん・おばあちゃんと若い世代が一緒に活動する\n\nこんなことを進めているんだ！'
    };
  }

  // ===== 送信 =====
  function setBusy(b) {
    state.busy = b;
    updateCounter();
    Array.prototype.forEach.call(els.choices.querySelectorAll('.choice'), function (c) { c.disabled = b; });
    els.resetBtn.disabled = b;
  }
  function send(question, opts) {
    opts = opts || {};
    var q = String(question || '').trim();
    if (!q || state.busy) return;
    if (q.length > MAX_CHARS) { showError('質問は ' + MAX_CHARS + ' 文字以内にしてね！'); return; }
    state.asked[q] = true;
    showPlayerLine(q);
    if (!opts.retry) addLog('user', q);
    setBusy(true);
    var thinking = showThinking();
    var payload = { question: q, history: state.history.slice(-MAX_HISTORY_TURNS * 2) };
    callAsk(payload).then(function (res) {
      thinking.stop();
      if (res && res.ok) {
        showAnswer(res);
        addLog('bot', res.answer);
        state.history.push({ role: 'user', text: q }, { role: 'model', text: res.answer });
        state.history = state.history.slice(-MAX_HISTORY_TURNS * 2);
        gainBond();
      } else {
        var retryable = res && ['BUSY', 'API', 'INTERNAL', 'EMPTY'].indexOf(res.code) >= 0;
        showError((res && res.error) || 'エラーが発生しました。', retryable ? q : null);
      }
    }, function (err) {
      thinking.stop();
      console.error(err);
      showError('通信エラーが発生しました。電波の良い場所でもう一度お試しください。', q);
    }).then(function () { setBusy(false); });
  }

  // ===== 入力欄 =====
  function autoGrow() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 96) + 'px';
  }
  function updateCounter() {
    var val = els.input.value || '', n = val.length;
    els.counter.textContent = n > MAX_CHARS * 0.8 ? n + ' / ' + MAX_CHARS : '';
    els.counter.className = 'counter' + (n > MAX_CHARS ? ' over' : '');
    els.send.disabled = state.busy || !val.trim().length || n > MAX_CHARS;
  }
  function bindComposer() {
    els.form.addEventListener('submit', function (e) {
      e.preventDefault();
      var q = els.input.value;
      if (!q.trim() || state.busy || q.length > MAX_CHARS) return;
      els.input.value = ''; autoGrow(); updateCounter();
      els.input.blur();
      send(q);
    });
    els.input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        els.form.requestSubmit ? els.form.requestSubmit() : els.form.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    });
    ['input', 'keyup', 'change', 'compositionend'].forEach(function (evt) {
      els.input.addEventListener(evt, function () { autoGrow(); updateCounter(); });
    });
    updateCounter();
  }

  function resetGame() {
    if (state.busy) return;
    state.history = []; state.log = []; state.asked = {};
    els.input.value = ''; autoGrow(); updateCounter();
    showWelcome();
  }

  // ===== スマホ：表示領域とキーボード対応 =====
  var baseH = 0, lastW = 0;
  function fitViewport() {
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    var w = vv ? vv.width : window.innerWidth;
    if (w !== lastW) { baseH = 0; lastW = w; }
    var focused = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
    if (!focused || h > baseH) baseH = Math.max(baseH, h);
    var kb = focused && baseH - h > 120;
    document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
    els.game.style.top = (vv ? Math.max(0, vv.offsetTop) : 0) + 'px';
    document.body.classList.toggle('kb-open', kb);
  }
  function bindViewport() {
    var vv = window.visualViewport;
    if (vv) { vv.addEventListener('resize', fitViewport); vv.addEventListener('scroll', fitViewport); }
    window.addEventListener('resize', fitViewport);
    window.addEventListener('orientationchange', function () { setTimeout(fitViewport, 300); });
    document.addEventListener('focusin', function () { setTimeout(fitViewport, 50); setTimeout(fitViewport, 350); });
    document.addEventListener('focusout', function () { setTimeout(fitViewport, 50); setTimeout(fitViewport, 350); });
    fitViewport();
  }

  // ===== 初期化 =====
  function init() {
    ['game', 'chara', 'dialog', 'nametag', 'dialogScroll', 'choices', 'playerLine', 'playerText', 'input', 'form', 'send',
     'counter', 'lv', 'gauge', 'gaugeFill', 'log', 'logBody', 'logBtn', 'logClose', 'resetBtn', 'statusFace']
      .forEach(function (id) { els[id] = document.getElementById(id); });

    els.chara.appendChild(charaImg('full', CHARA_ALT));
    els.statusFace.appendChild(charaImg('face', ''));
    els.chara.addEventListener('click', pokeChara);
    // 会話ウィンドウをタップ → 文字送りをスキップ
    els.dialog.addEventListener('click', function (e) {
      if (state.typing && !e.target.closest('button')) stopTyping(true);
    });
    els.logBtn.addEventListener('click', openLog);
    els.logClose.addEventListener('click', closeLog);
    els.log.addEventListener('click', function (e) { if (e.target === els.log) closeLog(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !els.log.hidden) closeLog(); });
    els.resetBtn.addEventListener('click', resetGame);

    bindComposer();
    bindViewport();
    loadXp(); renderBond();
    showWelcome();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
</script>
</body>
</html>
