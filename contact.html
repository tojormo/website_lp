<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>お問合せ ｜ とうじょうRMO｜兵庫県加東市東条地域の農村型地域運営組織</title>
<meta name="description" content="とうじょうRMO（兵庫県加東市東条地域）へのお問合せページ。活動へのご意見・ご質問・ご相談を、フォームまたはメールで受け付けています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* =========================================================
   お問合せページ：Googleフォーム埋め込み用スタイル
   ========================================================= */
.gform-embed{
  position:relative;
  width:100%;
  border:1px solid var(--line,#e4e6e2);
  border-radius:12px;
  overflow:hidden;
  background:var(--white,#fff);
  box-shadow:0 18px 42px -34px rgba(0,0,0,.45);
}
.gform-embed iframe{
  display:block;
  width:100%;
  min-height:1100px;   /* フォームの項目数に応じて調整してください */
  border:0;
}
/* フォームの下に添える注記 */
.gform-note{
  margin-top:14px;
  font-size:.84rem;
  color:var(--ink-soft,#5f6a63);
}
.gform-note a{color:var(--green,#2f7a43);}
</style>
</head>
<body>
<div id="site-header"></div>
<section class="page-hero">
  <img src="images/hero4.jpg" alt="東条地域の農村風景">
  <div class="wrap"><span class="eyebrow">Contact</span><h1>お問合せ</h1></div>
</section>
<div class="crumbs"><div class="wrap"><a href="index.html">HOME</a> ／ お問合せ</div></div>
<article class="article">
  <div class="wrap" style="max-width:820px;">
    <div class="reveal">
      <p>とうじょうRMOへのご意見・ご質問・ご相談は以下のフォームまたは連絡先へお願いいたします。</p>
    </div>
    <div class="reveal">
      <h2>お問合せフォーム</h2>

      <!-- ============================================================
           ▼▼▼ Googleフォームの埋め込み ▼▼▼
           使い方：
             1. Googleフォームを開き、右上「送信」→「< >（埋め込み HTML）」を選択
             2. 表示された <iframe ...> をコピー
             3. 下の <iframe ...> を丸ごと差し替える（src の URL を置き換えるだけでも可）
                ※ 末尾が「/viewform?embedded=true」になっている共有用URLです
           ============================================================ -->
      <div class="gform-embed">
        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLSe3mhJQr_Cekg2DSbexSbFl0TOWzvu6t_jJOeEc8Z-Sl9pMcA/viewform?usp=dialog"
          title="とうじょうRMO お問合せフォーム"
          loading="lazy">
          読み込んでいます…
        </iframe>
      </div>

      <p class="gform-note">
        フォームが表示されない場合は、
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSe3mhJQr_Cekg2DSbexSbFl0TOWzvu6t_jJOeEc8Z-Sl9pMcA/viewform?usp=dialog" target="_blank" rel="noopener">こちら（別ウィンドウで開く）</a>
        からご入力ください。
      </p>
    </div>
    <div class="reveal">
      <h2>連絡先</h2>
      <div class="contact-info">
        <div class="row"><b>団体名</b><span>とうじょうRMO</span></div>
        <div class="row"><b>所在地</b><span>〒673-1323 兵庫県加東市岡本247−4</span></div>
        <div class="row"><b>E-mail</b><span>okamotokouminkan3687@outlook.jp</span></div>
        <div class="row"><b>SNS</b><span><a href="https://www.instagram.com/kato.agri.japan/" target="_blank" rel="noopener" style="color:var(--green)">Instagram @kato.agri.japan</a></span></div>
      </div>
    </div>
    <a href="index.html" class="back-link">← トップへ戻る</a>
  </div>
</article>
<div id="site-footer"></div>
<script src="common.js"></script>
</body>
</html>
