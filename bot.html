<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>とうじょうRMO チャットアシスタント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   とうじょうRMO チャットアシスタント
   - 起動時   : キャラクター画面（bot_character.html デザイン）
   - 会話開始後: チャット画面   （bot.html デザイン）
   ========================================================= */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --green: #2f7a43;
  --green-deep: #245e34;
  --ink: #2a2f2c;
  --ink-soft: #5f6a63;
  --line: #e4e6e2;
  --white: #ffffff;
  --gray: #f4f5f2;
  --gray2: #eef0ec;
  --green-light: #9ed4ab;
  --green-pale: #eef5f0;
  --danger: #d9383a;
  --danger-soft: #fdf2f2;
  --ease: cubic-bezier(.22,.61,.36,1);
  --chara-h: clamp(150px, 34dvh, 320px);
}
html, body {
  height: 100%;
  background: var(--gray);
  font-family: "Noto Sans JP", sans-serif;
  color: var(--ink);
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  overflow: hidden;
}
button, input, textarea { font-family: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 画面切り替え ---------- */
.shell { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
.view {
  position: absolute; top: 0; bottom: 0; left: 0; right: 0;
  margin: 0 auto;
  display: flex; flex-direction: column;
  background: var(--white);
  box-shadow: 0 0 40px rgba(0,0,0,.05);
  overflow: hidden;
}
.view[hidden] { display: none; }
.view.is-leaving { animation: viewOut .32s var(--ease) forwards; pointer-events: none; }
.view.is-entering { animation: viewIn .38s var(--ease); }
@keyframes viewOut { to { opacity: 0; transform: translateY(-12px) scale(.98); } }
@keyframes viewIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- 共通：ヘッダー / ボタン ---------- */
header {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}
.logo-text { display: flex; flex-direction: column; line-height: 1.25; }
.logo-text strong { font-weight: 700; font-size: 1.05rem; letter-spacing: .04em; color: var(--green-deep); }
.logo-text small { font-family: "Inter","Noto Sans JP",sans-serif; font-weight: 500; font-size: .65rem; letter-spacing: .08em; color: var(--ink-soft); }
.btn-pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--white); color: var(--ink-soft);
  border-radius: 20px; padding: 6px 14px; font-size: .78rem; font-weight: 500;
  cursor: pointer; transition: all .25s var(--ease);
}
.btn-pill:hover { border-color: var(--green); color: var(--green); background: var(--gray); }

/* ---------- 共通：入力エリア ---------- */
.composer {
  display: flex; gap: 8px; align-items: flex-end;
  background: var(--gray); border: 1px solid var(--line); border-radius: 24px;
  padding: 4px 6px 4px 16px; transition: border-color .3s var(--ease), background .3s;
}
.composer:focus-within { border-color: var(--green); background: var(--white); box-shadow: 0 4px 16px -4px rgba(47,122,67,.15); }
.composer textarea {
  flex: 1; resize: none; border: none; outline: none; background: transparent;
  font: inherit; line-height: 1.5; padding: 9px 0; max-height: 120px; min-height: 40px;
  color: var(--ink); font-size: .94rem;
}
.composer textarea::placeholder { color: var(--ink-soft); opacity: .7; }
.send-btn {
  width: 38px; height: 38px; flex-shrink: 0; border: none; border-radius: 50%;
  background: var(--green); color: #fff; cursor: pointer; display: grid; place-items: center;
  transition: all .25s var(--ease);
}
.send-btn:hover:not(:disabled) { background: var(--green-deep); transform: translateY(-1px); }
.send-btn:disabled { background: var(--line) !important; color: #aab0aa !important; cursor: default !important; transform: none !important; }
.send-btn svg { width: 17px; height: 17px; transform: translateX(1px); }
.composer-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: .68rem; color: var(--ink-soft); padding: 0 4px; }
.counter.over { color: var(--danger); font-weight: 700; }

/* 共通：ドット */
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: blink 1.4s infinite ease-in-out both; }
.dots i:nth-child(1) { animation-delay: -.32s; }
.dots i:nth-child(2) { animation-delay: -.16s; }
@keyframes blink { 0%,80%,100% { transform: scale(0); opacity: .3; } 40% { transform: scale(1); opacity: 1; } }

/* =========================================================
   ① 起動時：キャラクター画面（bot_character.html）
   ========================================================= */
.view-intro { max-width: 720px; }
.view-intro header { padding: 10px 16px; background: rgba(255,255,255,.92); z-index: 30; }
.stage {
  position: relative; flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center;
  padding: 14px 16px 0;
  background:
    radial-gradient(ellipse 70% 45% at 50% 100%, rgba(158,212,171,.45), transparent 70%),
    radial-gradient(circle at 15% 20%, rgba(158,212,171,.18), transparent 35%),
    radial-gradient(circle at 85% 35%, rgba(158,212,171,.15), transparent 30%),
    linear-gradient(180deg, #fbfcfa 0%, var(--green-pale) 100%);
  overflow: hidden;
}
.leaf {
  position: absolute; width: 10px; height: 10px; border-radius: 0 70% 0 70%;
  background: var(--green-light); opacity: .55; pointer-events: none;
  animation: drift 9s linear infinite;
}
.leaf:nth-child(1) { left: 10%; top: 70%; animation-delay: 0s; }
.leaf:nth-child(2) { left: 82%; top: 60%; animation-delay: -3s; width: 8px; height: 8px; }
.leaf:nth-child(3) { left: 30%; top: 85%; animation-delay: -6s; width: 7px; height: 7px; }
.leaf:nth-child(4) { left: 68%; top: 90%; animation-delay: -1.5s; }
@keyframes drift {
  0% { transform: translate(0,0) rotate(0deg); opacity: 0; }
  15% { opacity: .55; }
  100% { transform: translate(30px,-260px) rotate(320deg); opacity: 0; }
}
.balloon-area {
  position: relative; z-index: 5; width: 100%; max-width: 580px;
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.balloon {
  position: relative; background: var(--white);
  border: 2px solid var(--green-light); border-radius: 22px;
  box-shadow: 0 10px 30px -12px rgba(36,94,52,.25);
  max-height: 100%; display: flex; flex-direction: column;
  animation: pop .35s var(--ease);
}
.balloon::after, .balloon::before {
  content: ""; position: absolute; left: 50%; transform: translateX(-50%);
  width: 0; height: 0; border-style: solid;
}
.balloon::before { bottom: -14px; border-width: 14px 12px 0; border-color: var(--green-light) transparent transparent; }
.balloon::after  { bottom: -10px; border-width: 12px 10px 0; border-color: var(--white) transparent transparent; }
.balloon.error { border-color: #f6c8c8; background: var(--danger-soft); }
.balloon.error::after { border-top-color: var(--danger-soft); }
.balloon.error::before { border-top-color: #f6c8c8; }
@keyframes pop {
  0% { transform: scale(.92) translateY(8px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
.balloon-scroll { overflow-y: auto; padding: 16px 20px 14px; overscroll-behavior: contain; }
.speaker {
  display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .08em;
  color: #fff; background: var(--green); padding: 2px 12px; border-radius: 20px;
  position: absolute; top: -12px; left: 18px;
}
.balloon.error .speaker { background: var(--danger); }
.greet { text-align: center; font-size: 1.15rem; font-weight: 700; color: var(--green-deep); line-height: 1.6; padding: 6px 0 2px; }
.greet-sub { text-align: center; font-size: .8rem; color: var(--ink-soft); margin-top: 4px; }
.error-text { color: var(--danger); font-size: .9rem; text-align: center; }
.chara-wrap {
  position: relative; z-index: 4; flex-shrink: 0;
  height: var(--chara-h); margin-top: 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
}
.chara-body {
  height: calc(100% - 26px);
  display: flex; align-items: flex-end; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.chara-body img {
  height: 100%; width: auto; max-width: 80vw; display: block; object-fit: contain;
  filter: drop-shadow(0 14px 18px rgba(36,94,52,.18));
  transform-origin: 50% 100%;
  animation: float 3.5s ease-in-out infinite;
}
.chara-body img.fallback { border-radius: 50%; }
.chara-shadow {
  position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
  width: 46%; height: 14px; border-radius: 50%;
  background: rgba(36,94,52,.16); filter: blur(3px);
  animation: shadow 3.5s ease-in-out infinite;
}
.nameplate {
  position: relative; z-index: 2; font-size: .7rem; font-weight: 600; color: var(--green-deep);
  background: rgba(255,255,255,.85); border: 1px solid var(--line);
  border-radius: 20px; padding: 1px 12px; margin-top: 4px; letter-spacing: .06em;
}
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes shadow { 0%,100% { transform: translateX(-50%) scale(1); opacity: 1; } 50% { transform: translateX(-50%) scale(.85); opacity: .7; } }
.stage.is-happy .chara-body img { animation: hop .6s var(--ease) 2, float 3.5s ease-in-out .6s infinite; }
@keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-22px); } }
.stage.is-error .chara-body img { animation: shake .5s ease-in-out 2, float 3.5s ease-in-out 1s infinite; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px) rotate(-3deg); } 75% { transform: translateX(6px) rotate(3deg); } }
.view-intro .chips-bar { background: var(--white); border-top: 1px solid var(--line); padding: 10px 0 2px; }
.view-intro .chips-title { font-size: .68rem; color: var(--ink-soft); padding: 0 18px 4px; font-weight: 600; letter-spacing: .04em; }
.view-intro .chips {
  display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 8px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.view-intro .chips::-webkit-scrollbar { display: none; }
.view-intro .chip {
  flex-shrink: 0; background: var(--white); border: 1px solid var(--green-light);
  border-radius: 20px; padding: 6px 14px; font-size: .82rem; font-weight: 500; color: var(--green-deep);
  cursor: pointer; transition: all .25s var(--ease); white-space: nowrap;
}
.view-intro .chip:hover { background: var(--green); border-color: var(--green); color: #fff; }
.view-intro .chip:disabled { opacity: .45; cursor: default; background: var(--white); color: var(--green-deep); border-color: var(--line); }
.view-intro .composer-wrap { padding: 6px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--white); z-index: 20; }
@media (max-height: 640px) { :root { --chara-h: clamp(120px, 28dvh, 220px); } }

/* =========================================================
   ② 会話開始後：チャット画面（bot.html）
   ========================================================= */
.view-chat { max-width: 680px; }
.view-chat header { padding: 12px 18px; background: rgba(255,255,255,.95); z-index: 20; }
.header-brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 40px; height: 40px; border-radius: 50%; background: var(--gray);
  border: 1px solid var(--line); overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.brand-icon img { width: 100%; height: 100%; object-fit: cover; object-position: center center; display: block; }
#chat { flex: 1; overflow-y: auto; padding: 18px 16px; scroll-behavior: smooth; background: var(--gray); }
.msg { display: flex; gap: 10px; margin: 16px 0; align-items: flex-start; }
.msg.user { justify-content: flex-end; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
  background: var(--white); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  transform-origin: 50% 50%;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center center; display: block; }
/* 生成中：画像ではなく円形の枠ごと揺らす（端が切れない） */
.avatar.thinking { animation: think 1.2s ease-in-out infinite; }
@keyframes think { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) translateY(-2px); } }
.bot-col { flex: 1; min-width: 0; }
.bubble { border-radius: 14px; padding: 13px 17px; word-wrap: break-word; overflow-wrap: anywhere; font-size: .92rem; line-height: 1.8; }
.user .bubble {
  background: var(--green); color: #fff; border-top-right-radius: 4px; font-weight: 500;
  max-width: 84%; white-space: pre-wrap; box-shadow: 0 4px 14px -6px rgba(47,122,67,.4);
}
.bot .bubble {
  background: var(--white); border: 1px solid var(--line); border-top-left-radius: 4px;
  color: var(--ink); box-shadow: 0 4px 18px -8px rgba(0,0,0,.06);
}
.bot.error .bubble { background: var(--danger-soft); border-color: #f6c8c8; color: var(--danger); }
.md p { margin: 0 0 10px; }
.md p:last-child { margin-bottom: 0; }
.md .h { font-weight: 700; color: var(--green-deep); margin: 14px 0 6px; font-size: .98rem; }
.md strong { color: var(--green-deep); font-weight: 700; }
.md ul, .md ol { margin: 6px 0 12px; padding-left: 1.4em; }
.md li { margin: 3px 0; color: var(--ink); }
.md li::marker { color: var(--green); }
.md code { background: var(--gray); border: 1px solid var(--line); color: var(--green-deep); border-radius: 4px; padding: 1px 6px; font-size: .88em; font-family: "Inter",sans-serif; }
.md blockquote { margin: 8px 0 12px; padding: 6px 14px; border-left: 3px solid var(--green); background: var(--gray); border-radius: 0 8px 8px 0; color: var(--ink-soft); font-size: .88rem; }
.table-wrap { overflow-x: auto; margin: 8px 0 14px; border: 1px solid var(--line); border-radius: 8px; }
.md table { border-collapse: collapse; font-size: .82rem; width: 100%; min-width: 320px; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 8px 12px; text-align: left; }
.md th { background: var(--gray); color: var(--green-deep); font-weight: 700; white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; font-size: .72rem; color: var(--ink-soft); font-family: "Inter",sans-serif; }
.meta .spacer { flex: 1; }
.meta button { border: 1px solid var(--line); background: var(--white); color: var(--ink-soft); cursor: pointer; font-size: .72rem; padding: 3px 10px; border-radius: 12px; transition: all .2s var(--ease); }
.meta button:hover { border-color: var(--green); color: var(--green); background: var(--gray); }
.notice { font-size: .8rem; color: var(--ink-soft); background: var(--gray); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin-top: 10px; }
.typing { display: flex; align-items: center; gap: 8px; color: var(--green); font-size: .85rem; font-weight: 600; }
.retry { margin-top: 8px; border: 1px solid var(--danger); background: var(--white); color: var(--danger); border-radius: 20px; padding: 5px 14px; cursor: pointer; font-size: .8rem; font-weight: 600; transition: all .2s var(--ease); }
.retry:hover { background: var(--danger); color: #fff; }
.view-chat .composer-wrap { padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--white); border-top: 1px solid var(--line); z-index: 20; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="shell">

  <!-- ===================== ① 起動時：キャラクター画面 ===================== -->
  <div class="view view-intro" id="introView">
    <header>
      <div class="logo-text">
        <strong>とうじょうRMO</strong>
        <small>AI しつもん妖精</small>
      </div>
    </header>
    <main class="stage" id="stage">
      <span class="leaf"></span><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span>
      <div class="balloon-area" aria-live="polite">
        <div class="balloon" id="balloon">
          <span class="speaker">RMOの妖精</span>
          <div class="balloon-scroll" id="balloonScroll"></div>
        </div>
      </div>
      <div class="chara-wrap">
        <div class="chara-body" id="charaBody" title="タップしてね"></div>
        <div class="chara-shadow"></div>
        <div class="nameplate">東条地域の案内役</div>
      </div>
    </main>
    <div class="chips-bar">
      <div class="chips-title">こんなこと聞いてみてね</div>
      <div class="chips" id="introChips"></div>
    </div>
    <div class="composer-wrap">
      <form class="composer" id="introForm" autocomplete="off">
        <label for="introInput" class="sr-only">質問を入力</label>
        <textarea id="introInput" rows="1" maxlength="1200" placeholder="妖精に話しかけてね"></textarea>
        <button type="submit" class="send-btn" id="introSend" aria-label="送信">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <div class="composer-foot">
        <span>※AIの妖精がお答えします。くわしくは事務局にご確認ください。</span>
        <span class="counter" id="introCounter"></span>
      </div>
    </div>
  </div>

  <!-- ===================== ② 会話開始後：チャット画面 ===================== -->
  <div class="view view-chat" id="chatView" hidden>
    <header>
      <div class="header-brand">
        <div class="brand-icon" id="brandIcon"></div>
        <div class="logo-text">
          <strong>とうじょうRMO</strong>
          <small>AI しつもん妖精</small>
        </div>
      </div>
      <button type="button" class="btn-pill" id="clear" aria-label="最初から"><span>↺</span> 最初から</button>
    </header>
    <main id="chat" aria-live="polite"></main>
    <div class="composer-wrap">
      <form class="composer" id="chatForm" autocomplete="off">
        <label for="chatInput" class="sr-only">質問を入力</label>
        <textarea id="chatInput" rows="1" maxlength="1200" placeholder="質問を入力してね"></textarea>
        <button type="submit" class="send-btn" id="chatSend" aria-label="送信">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <div class="composer-foot">
        <span>※AIの妖精がお答えします。くわしくは事務局にご確認ください。</span>
        <span class="counter" id="chatCounter"></span>
      </div>
    </div>
  </div>

</div>
<script>
  // ===== 設定 =====
  var GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwyNSdhkTZ5b8HCTXBGhIHOaYQrvg8vyohEws7m7rbP_wbyLkz_--m5tJbaSujH2G5dzw/exec';
  var IMG_BASE = 'images/';
  var CHARA_ALT = 'とうじょうRMOの妖精';
  var MAX_CHARS = 1000;
  var MAX_HISTORY_TURNS = 6;
  var GREETING = 'やっほー！\nとうじょうRMOのこと、\nなんでも聞いてね！';
  var EXAMPLES = [
    'とうじょうRMOってなに？',
    'どんな課題があるの？',
    'スマート農業ってどういうこと？',
    'わたしも参加できる？'
  ];
  // キャラをタップしたときのひとこと（起動画面）
  var POKE_LINES = [
    'わっ！くすぐったいよ〜',
    '東条のお米、おいしいんだよ！',
    '気になることがあったら、下から話しかけてね！',
    '山田錦って知ってる？酒米なんだ！'
  ];

  var state = { history: [], busy: false, mode: 'intro' };
  var els = {};
  var composers = {};
  var HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;

  // ===== キャラクター画像（フォールバック用SVG） =====
  var FALLBACK_FACE = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
    '<circle cx="32" cy="32" r="32" fill="#eef5f0"/>' +
    '<path d="M32 10 Q46 10 46 32 Q46 52 32 52 Q18 52 18 32 Q18 10 32 10" fill="#9ed4ab"/>' +
    '<circle cx="26" cy="28" r="3.2" fill="#245e34"/>' +
    '<circle cx="38" cy="28" r="3.2" fill="#245e34"/>' +
    '<path d="M28 37 Q32 41 36 37" stroke="#245e34" stroke-width="2.6" fill="none" stroke-linecap="round"/>' +
    '<path d="M20 18 Q25 13 32 15 Q29 20 20 18" fill="#2f7a43"/>' +
    '<path d="M44 18 Q39 13 32 15 Q35 20 44 18" fill="#2f7a43"/>' +
    '</svg>');
  function charaSrc(kind) { return IMG_BASE + (kind === 'full' ? 'chara-full_nograin.png' : 'chara-face.png'); }
  function charaImg(kind, alt) {
    var img = document.createElement('img');
    img.className = 'chara-img';
    img.dataset.kind = kind;
    img.alt = alt || '';
    img.addEventListener('error', function onErr() {
      img.removeEventListener('error', onErr);
      img.src = FALLBACK_FACE;
      if (kind === 'full') img.classList.add('fallback');
    });
    img.src = charaSrc(kind);
    return img;
  }

  // ===== HTML エスケープ + Markdown =====
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function inlineMd(escaped) {
    return escaped
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  function isTableSep(line) {
    return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(line);
  }
  function tableCells(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return inlineMd(esc(c.trim())); });
  }
  var RE_UL = /^\s*(?:[-*]\s+|・\s*)(.*)$/;
  var RE_OL = /^\s*(\d+)[.)．]\s+(.*)$/;
  var RE_H = /^\s*#{1,6}\s+(.*)$/;
  var RE_QUOTE = /^\s*>\s?(.*)$/;
  function startsBlock(lines, i) {
    var l = lines[i];
    return RE_UL.test(l) || RE_OL.test(l) || RE_H.test(l) || RE_QUOTE.test(l) ||
      (l.indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1]));
  }
  function renderMarkdown(md) {
    var lines = String(md == null ? '' : md).replace(/\r\n?/g, '\n').split('\n');
    var html = '', i = 0, m, items;
    while (i < lines.length) {
      var l = lines[i];
      if (!l.trim()) { i++; continue; }
      if (l.indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var head = tableCells(l); i += 2;
        var rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') >= 0) { rows.push(tableCells(lines[i])); i++; }
        html += '<div class="table-wrap"><table><thead><tr>' +
          head.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
          rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</tbody></table></div>';
        continue;
      }
      if ((m = l.match(RE_H))) { html += '<p class="h">' + inlineMd(esc(m[1])) + '</p>'; i++; continue; }
      if (RE_UL.test(l)) {
        items = [];
        while (i < lines.length && (m = lines[i].match(RE_UL))) { items.push('<li>' + inlineMd(esc(m[1])) + '</li>'); i++; }
        html += '<ul>' + items.join('') + '</ul>'; continue;
      }
      if ((m = l.match(RE_OL))) {
        var start = parseInt(m[1], 10) || 1;
        items = [];
        while (i < lines.length && (m = lines[i].match(RE_OL))) { items.push('<li>' + inlineMd(esc(m[2])) + '</li>'); i++; }
        html += '<ol' + (start !== 1 ? ' start="' + start + '"' : '') + '>' + items.join('') + '</ol>'; continue;
      }
      if (RE_QUOTE.test(l)) {
        items = [];
        while (i < lines.length && (m = lines[i].match(RE_QUOTE))) { items.push(inlineMd(esc(m[1]))); i++; }
        html += '<blockquote>' + items.join('<br>') + '</blockquote>'; continue;
      }
      var buf = [inlineMd(esc(l.trim()))]; i++;
      while (i < lines.length && lines[i].trim() && !startsBlock(lines, i)) { buf.push(inlineMd(esc(lines[i].trim()))); i++; }
      html += '<p>' + buf.join('<br>') + '</p>';
    }
    return html;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // =========================================================
  // ① 起動時：キャラクター画面
  // =========================================================
  var moodTimer = null;
  function setMood(mood, durationMs) {
    clearTimeout(moodTimer);
    els.stage.classList.remove('is-happy', 'is-error');
    if (mood && mood !== 'idle') els.stage.classList.add('is-' + mood);
    if (durationMs) moodTimer = setTimeout(function () { setMood('idle'); }, durationMs);
  }
  function resetBalloon(isError) {
    var b = els.balloon;
    b.classList.toggle('error', !!isError);
    b.style.animation = 'none';
    void b.offsetWidth;
    b.style.animation = '';
    els.balloonScroll.innerHTML = '';
    els.balloonScroll.scrollTop = 0;
    return els.balloonScroll;
  }
  function renderIntroWelcome() {
    var box = resetBalloon(false);
    var g = el('div', 'greet');
    g.innerHTML = esc(GREETING).replace(/\n/g, '<br>');
    box.appendChild(g);
    box.appendChild(el('p', 'greet-sub', '下のボタンを選ぶか、自由に話しかけてね！'));
    setMood('happy', 1300);
  }
  function introError(message) {
    var box = resetBalloon(true);
    box.appendChild(el('div', 'error-text', message));
    setMood('error', 1200);
  }
  function pokeChara() {
    if (state.busy) return;
    var box = resetBalloon(false);
    box.appendChild(el('div', 'greet', POKE_LINES[Math.floor(Math.random() * POKE_LINES.length)]));
    setMood('happy', 1300);
  }
  function renderIntroChips() {
    els.introChips.innerHTML = '';
    EXAMPLES.forEach(function (q) {
      var c = el('button', 'chip', q);
      c.type = 'button';
      c.addEventListener('click', function () { send(q); });
      els.introChips.appendChild(c);
    });
  }

  // ===== 画面切り替え =====
  function swapView(fromEl, toEl, onDone) {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    toEl.hidden = false;
    if (reduce) { fromEl.hidden = true; if (onDone) onDone(); return; }
    toEl.classList.add('is-entering');
    fromEl.classList.add('is-leaving');
    setTimeout(function () {
      fromEl.hidden = true;
      fromEl.classList.remove('is-leaving');
      toEl.classList.remove('is-entering');
      if (onDone) onDone();
    }, 340);
  }
  function enterChatMode() {
    if (state.mode === 'chat') return;
    state.mode = 'chat';
    composers.intro.input.value = '';
    autoGrow(composers.intro); updateCounter(composers.intro);
    swapView(els.introView, els.chatView);
  }
  function enterIntroMode() {
    state.mode = 'intro';
    swapView(els.chatView, els.introView, function () { els.chat.innerHTML = ''; });
    renderIntroWelcome();
  }

  // =========================================================
  // ② 会話開始後：チャット画面
  // =========================================================
  function scrollToBottom() { els.chat.scrollTop = els.chat.scrollHeight; }
  function botRow(extraCls) {
    var row = el('div', 'msg bot' + (extraCls ? ' ' + extraCls : ''));
    var av = el('div', 'avatar');
    av.appendChild(charaImg('face', ''));
    var col = el('div', 'bot-col');
    var b = el('div', 'bubble');
    col.appendChild(b);
    row.appendChild(av); row.appendChild(col);
    return { row: row, bubble: b, avatar: av };
  }
  function addUserMessage(text) {
    var row = el('div', 'msg user');
    row.appendChild(el('div', 'bubble', text));
    els.chat.appendChild(row);
    scrollToBottom();
  }
  function addTyping() {
    var r = botRow();
    r.avatar.classList.add('thinking');
    var t = el('div', 'typing');
    var dots = el('span', 'dots');
    dots.innerHTML = '<i></i><i></i><i></i>';
    var label = el('span', null, '資料をよんでいます…');
    t.appendChild(dots); t.appendChild(label); r.bubble.appendChild(t);
    els.chat.appendChild(r.row);
    scrollToBottom();
    var sec = 0;
    var timer = setInterval(function () {
      sec++;
      if (sec === 3) label.textContent = 'お返事を考えているよ…';
      if (sec >= 12) label.textContent = 'もう少し待ってね…';
    }, 1000);
    return { remove: function () { clearInterval(timer); r.row.remove(); } };
  }
  function copyText(text, btn) {
    function done() { var o = btn.textContent; btn.textContent = 'コピーしました'; setTimeout(function () { btn.textContent = o; }, 1500); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  function addBotAnswer(res) {
    var r = botRow();
    var body = el('div', 'md');
    body.innerHTML = renderMarkdown(res.answer);
    r.bubble.appendChild(body);
    if (res.truncated) r.bubble.appendChild(el('div', 'notice', '※ 文章が長いため途中で終了しました。質問を分けて試してみてね。'));
    var meta = el('div', 'meta');
    if (res.elapsedMs) meta.appendChild(el('span', null, (res.elapsedMs / 1000).toFixed(1) + 's'));
    meta.appendChild(el('span', 'spacer'));
    var copy = el('button', null, 'コピー');
    copy.type = 'button';
    copy.addEventListener('click', function () { copyText(res.answer, copy); });
    meta.appendChild(copy);
    r.bubble.appendChild(meta);
    els.chat.appendChild(r.row);
    scrollToBottom();
  }
  function addError(message, retryQuestion) {
    var r = botRow('error');
    r.bubble.appendChild(el('div', null, message));
    if (retryQuestion) {
      var btn = el('button', 'retry', 'もういちど送信');
      btn.type = 'button';
      btn.addEventListener('click', function () {
        if (state.busy) return;
        r.row.remove();
        send(retryQuestion, { skipUserBubble: true });
      });
      r.bubble.appendChild(btn);
    }
    els.chat.appendChild(r.row);
    scrollToBottom();
  }

  // ===== サーバー呼び出し =====
  function clientId() {
    try {
      var id = localStorage.getItem('chat_cid');
      if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('chat_cid', id); }
      return id;
    } catch (e) { return ''; }
  }
  function callAsk(payload) {
    if (HAS_GAS) {
      return new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).ask(payload);
      });
    }
    if (GAS_ENDPOINT) {
      payload.clientId = clientId();
      return fetch(GAS_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    }
    return new Promise(function (resolve) { setTimeout(function () { resolve(previewAnswer(payload)); }, 1200); });
  }
  function previewAnswer() {
    return {
      ok: true, elapsedMs: 1200, model: 'preview', fallback: false,
      answer: '（プレビュー表示だよ！GASと連携すると本番の回答が返ってくるよ）\n\n**とうじょうRMO**は、東条地域の「岡本・森・南山」のみんなが手を取り合って、農業と豊かな暮らしを未来につなぐためのチームだよ！\n\n- お米（酒米・山田錦）の畑や水路を守る\n- スマート農業で、作業を少しでも楽にする\n- おじいちゃん・おばあちゃんと若い世代が一緒に活動する\n\nこんなことを進めているんだ！',
      sources: [{ doc: 'サイト情報まとめ', url: 'https://tojormo.com/', excerpts: ['農村RMO（農村型地域運営組織）とは | 複数の集落の機能を補完して、農用地保全活動や農業を核とした経済活動と併せて、生活支援など地域コミュニティの維持に資する取組を行う組織です。'] }]
    };
  }

  // ===== 送信・ビジー制御 =====
  function setBusy(b) {
    state.busy = b;
    updateCounter(composers.intro);
    updateCounter(composers.chat);
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) { c.disabled = b; });
  }
  function send(question, opts) {
    opts = opts || {};
    var q = String(question || '').trim();
    if (!q || state.busy) return;
    if (q.length > MAX_CHARS) {
      var msg = '質問は ' + MAX_CHARS + ' 文字以内にしてね！';
      if (state.mode === 'intro') introError(msg); else addError(msg);
      return;
    }
    // 最初の質問でチャット画面へ切り替え
    if (state.mode === 'intro') enterChatMode();
    if (!opts.skipUserBubble) addUserMessage(q);
    setBusy(true);
    var typing = addTyping();
    var payload = { question: q, history: state.history.slice(-MAX_HISTORY_TURNS * 2) };
    callAsk(payload).then(function (res) {
      typing.remove();
      if (res && res.ok) {
        addBotAnswer(res);
        state.history.push({ role: 'user', text: q }, { role: 'model', text: res.answer });
        state.history = state.history.slice(-MAX_HISTORY_TURNS * 2);
      } else {
        var retryable = res && ['BUSY', 'API', 'INTERNAL', 'EMPTY'].indexOf(res.code) >= 0;
        addError((res && res.error) || 'エラーが発生しました。', retryable ? q : null);
      }
    }, function (err) {
      typing.remove();
      console.error(err);
      addError('通信エラーが発生しました。電波の良い場所でもう一度お試しください。', q);
    }).then(function () {
      setBusy(false);
    });
  }

  // ===== 入力欄とカウンター =====
  function autoGrow(c) {
    c.input.style.height = 'auto';
    c.input.style.height = Math.min(c.input.scrollHeight, 120) + 'px';
  }
  function updateCounter(c) {
    if (!c) return;
    var val = c.input.value || '';
    var n = val.length;
    c.counter.textContent = n > MAX_CHARS * 0.8 ? n + ' / ' + MAX_CHARS : '';
    c.counter.className = 'counter' + (n > MAX_CHARS ? ' over' : '');
    c.send.disabled = state.busy || !val.trim().length || n > MAX_CHARS;
  }
  function bindComposer(c) {
    c.form.addEventListener('submit', function (e) {
      e.preventDefault();
      var q = c.input.value;
      if (!q.trim() || state.busy || q.length > MAX_CHARS) return;
      c.input.value = '';
      autoGrow(c);
      updateCounter(c);
      c.input.blur();
      send(q);
    });
    c.input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        c.form.requestSubmit ? c.form.requestSubmit() : c.form.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    });
    ['input', 'keyup', 'change', 'compositionend'].forEach(function (evt) {
      c.input.addEventListener(evt, function () { autoGrow(c); updateCounter(c); });
    });
    updateCounter(c);
  }
  function makeComposer(prefix) {
    return {
      form: document.getElementById(prefix + 'Form'),
      input: document.getElementById(prefix + 'Input'),
      send: document.getElementById(prefix + 'Send'),
      counter: document.getElementById(prefix + 'Counter')
    };
  }

  // 「最初から」→ 起動画面に戻る
  function resetChat() {
    if (state.busy) return;
    state.history = [];
    composers.chat.input.value = '';
    autoGrow(composers.chat); updateCounter(composers.chat);
    enterIntroMode();
  }

  // ===== 初期化 =====
  function init() {
    els.introView = document.getElementById('introView');
    els.chatView = document.getElementById('chatView');
    els.stage = document.getElementById('stage');
    els.balloon = document.getElementById('balloon');
    els.balloonScroll = document.getElementById('balloonScroll');
    els.introChips = document.getElementById('introChips');
    els.chat = document.getElementById('chat');

    composers.intro = makeComposer('intro');
    composers.chat = makeComposer('chat');
    bindComposer(composers.intro);
    bindComposer(composers.chat);

    var body = document.getElementById('charaBody');
    body.appendChild(charaImg('full', CHARA_ALT));
    body.addEventListener('click', pokeChara);
    document.getElementById('brandIcon').appendChild(charaImg('face', ''));

    renderIntroChips();
    renderIntroWelcome();
    document.getElementById('clear').addEventListener('click', resetChat);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
</script>
</body>
